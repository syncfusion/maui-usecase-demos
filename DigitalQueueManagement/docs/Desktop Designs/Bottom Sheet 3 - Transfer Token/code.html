};</script></head><body class="min-h-screen bg-surface font-body-md text-body-md text-on-surface flex items-center justify-center p-space-lg lg:p-space-2xl"><main class="w-full flex items-center justify-center"><div class="flex flex-col w-full">
<div class="w-full flex items-center justify-center py-space-xl">
<!-- Centered Enterprise Modal Card (~540px) -->
<div class="w-full max-w-[460px] bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden transition-all duration-200">
  <!-- Header -->
  <div class="px-6 pt-6 pb-4 flex items-center justify-between border-b border-slate-100">
    <div class="flex items-center gap-2.5">
      <span class="material-symbols-outlined text-blue-900 text-[24px]">swap_horiz</span>
      <h2 class="text-lg font-bold text-slate-900 tracking-tight">Transfer Token</h2>
    </div>
    <button id="closeModalBtn" type="button" aria-label="Close dialog" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors">
      <span class="material-symbols-outlined text-[20px]">close</span>
    </button>
  </div>

  <!-- Body -->
  <div class="p-6 flex flex-col gap-5">
    <!-- Current Counter Banner -->
    <div class="bg-slate-50 border border-slate-200/70 rounded-xl p-4 flex items-center justify-between">
      <div class="flex flex-col gap-0.5">
        <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">CURRENT COUNTER</span>
        <span class="text-sm font-semibold text-slate-800">Counter 1 (Express Desk)</span>
      </div>
      <span class="bg-blue-50 text-blue-700 font-semibold px-2.5 py-1 rounded-full text-xs">Token A-105</span>
    </div>

    <!-- Destination Counters Section -->
    <div class="flex flex-col gap-2.5">
      <label class="text-[11px] font-bold uppercase tracking-wider text-slate-500">SELECT DESTINATION COUNTER</label>
      
      <div class="flex flex-col gap-2.5" role="radiogroup" aria-label="Destination Counters">
        <!-- Option 1: Current Desk -->
        <label class="counter-option relative flex items-center justify-between p-3.5 rounded-xl border border-slate-200 bg-white text-slate-800 cursor-pointer hover:bg-slate-50 transition-all" data-id="counter-1">
          <div class="flex items-center gap-3">
            <div class="radio-indicator w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center bg-white">
              <span class="w-2 h-2 rounded-full bg-transparent"></span>
            </div>
            <span class="text-sm font-medium text-slate-700">Counter 1</span>
          </div>
          <span class="text-xs text-slate-500 font-medium">Current Desk</span>
          <input type="radio" name="target_counter" value="counter-1" class="sr-only">
        </label>

        <!-- Option 2: Selected -->
        <label class="counter-option relative flex items-center justify-between p-3.5 rounded-xl border-2 border-blue-900 bg-blue-50/40 text-slate-900 cursor-pointer transition-all shadow-sm" data-id="counter-2">
          <div class="flex items-center gap-3">
            <div class="radio-indicator w-5 h-5 rounded-full bg-blue-900 text-white flex items-center justify-center">
              <span class="material-symbols-outlined text-[13px] font-bold">check</span>
            </div>
            <span class="text-sm font-bold text-slate-900">Counter 2</span>
          </div>
          <span class="bg-emerald-50 text-emerald-700 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-emerald-200/50">Available</span>
          <input type="radio" name="target_counter" value="counter-2" class="sr-only" checked="">
        </label>

        <!-- Option 3 -->
        <label class="counter-option relative flex items-center justify-between p-3.5 rounded-xl border border-slate-200 bg-white text-slate-800 cursor-pointer hover:bg-slate-50 transition-all" data-id="counter-3">
          <div class="flex items-center gap-3">
            <div class="radio-indicator w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center bg-white">
              <span class="w-2 h-2 rounded-full bg-transparent"></span>
            </div>
            <span class="text-sm font-medium text-slate-700">Counter 3</span>
          </div>
          <span class="bg-emerald-50 text-emerald-700 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-emerald-200/50">Available</span>
          <input type="radio" name="target_counter" value="counter-3" class="sr-only">
        </label>
      </div>
    </div>

    <!-- Notice Box -->
    <div class="flex items-start gap-2.5 p-3 rounded-xl bg-slate-50 border border-slate-200/60 text-slate-600 text-xs leading-relaxed">
      <span class="material-symbols-outlined text-slate-400 text-[18px] shrink-0 mt-0.5">info</span>
      <span class="">The selected token will continue serving at the destination counter.</span>
    </div>

    <!-- Actions (Stacked Full-Width Buttons) -->
    <div class="flex flex-col gap-2 pt-1">
      <button id="confirmTransferBtn" type="button" class="w-full py-3 px-4 rounded-xl bg-blue-900 hover:bg-blue-800 text-white font-semibold text-sm flex items-center justify-center gap-2 shadow-sm transition-all">
        <span class="material-symbols-outlined text-[18px]">swap_horiz</span>
        <span class="">Confirm Transfer</span>
      </button>
      <button id="cancelTransferBtn" type="button" class="w-full py-3 px-4 rounded-xl bg-transparent hover:bg-slate-100 text-slate-700 font-medium text-sm flex items-center justify-center transition-colors">
        Cancel
      </button>
    </div>
  </div>
</div>
</div>
<script>
    (function () {
      const options = document.querySelectorAll('.counter-option');
      const confirmBtn = document.getElementById('confirmTransferBtn');
      const cancelBtn = document.getElementById('cancelTransferBtn');
      const closeBtn = document.getElementById('closeModalBtn');

      options.forEach(opt => {
        opt.addEventListener('click', function () {
          options.forEach(o => {
            o.classList.remove('bg-surface-container-high', 'shadow-sm');
            o.classList.add('bg-surface-container-low');
            const ind = o.querySelector('.radio-indicator');
            ind.classList.remove('bg-primary', 'text-on-primary');
            ind.classList.add('bg-surface-container-highest', 'text-transparent');
          });

          this.classList.remove('bg-surface-container-low');
          this.classList.add('bg-surface-container-high', 'shadow-sm');
          const ind = this.querySelector('.radio-indicator');
          ind.classList.remove('bg-surface-container-highest', 'text-transparent');
          ind.classList.add('bg-primary', 'text-on-primary');
        });
      });

      function handleDismiss() {
        const modal = document.querySelector('.max-w-\\[540px\\]');
        if (modal) {
          modal.style.transform = 'scale(0.98)';
          modal.style.opacity = '0.6';
          setTimeout(() => {
            modal.style.transform = 'scale(1)';
            modal.style.opacity = '1';
          }, 180);
        }
      }

      if (confirmBtn) {
        confirmBtn.addEventListener('click', function () {
          const originalText = confirmBtn.innerHTML;
          confirmBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">refresh</span><span>Transferring...</span>';
          confirmBtn.disabled = true;
          setTimeout(() => {
            confirmBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">done_all</span><span>Transferred</span>';
            setTimeout(() => {
              confirmBtn.innerHTML = originalText;
              confirmBtn.disabled = false;
            }, 1200);
          }, 600);
        });
      }

      if (cancelBtn) cancelBtn.addEventListener('click', handleDismiss);
      if (closeBtn) closeBtn.addEventListener('click', handleDismiss);
    })();
  </script>
</div></main>



</body></html>
