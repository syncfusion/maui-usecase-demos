<!-- Subtle Ambient Glow Behind Modal -->
<div class="relative w-full max-w-[500px] flex flex-col items-center">
<div class="absolute -top-12 -left-12 w-48 h-48 bg-error/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-10 -right-10 w-44 h-44 bg-primary/10 rounded-full blur-2xl pointer-events-none"></div>

<div class="relative w-full bg-surface-container-lowest rounded-full shadow-2xl p-space-2xl flex flex-col items-center text-center">
<!-- Close Quick Action -->
<button aria-label="Close dialog" class="absolute top-space-lg right-space-lg w-8 h-8 rounded-full bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-on-surface-variant transition-colors" onclick="this.closest('.relative').style.transform='scale(0.98)'; setTimeout(() =&gt; { this.closest('.relative').style.transform='scale(1)'; }, 150);" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
<!-- Warning Icon Badge -->
<div class="w-16 h-16 rounded-full bg-error-container/60 flex items-center justify-center text-error mb-space-lg shadow-sm">
<span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">
          warning
        </span>
</div>
<!-- Title -->
<h2 class="font-headline-md text-headline-md text-on-surface tracking-tight mb-space-xs">
        Reset Queue
      </h2>
<!-- Description Body -->
<p class="font-body-md text-body-md text-on-surface-variant max-w-[420px] mb-space-xl">This will restore the original sample queue and remove all current changes.</p>
<!-- Impact Summary Box -->

<!-- Modal Actions Grid -->
<div class="w-full grid grid-cols-2 gap-space-md">
<!-- Cancel Action -->
<button class="w-full h-11 px-space-lg rounded-lg bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high text-on-surface font-label-lg text-label-lg flex items-center justify-center transition-all duration-150 shadow-sm" onclick="const card = this.closest('.w-full'); card.style.opacity='0.7'; setTimeout(() =&gt; card.style.opacity='1', 200);" type="button">
          Cancel
        </button>
<!-- Destructive Reset Action -->
<button class="w-full h-11 px-space-lg rounded-lg bg-error hover:bg-error/90 active:bg-on-error-container text-on-error font-label-lg text-label-lg flex items-center justify-center gap-space-xs shadow-md transition-all duration-150" id="confirm-reset-btn" onclick="const btn = this; btn.disabled = true; btn.innerHTML = '&lt;span class=\'material-symbols-outlined text-[20px] animate-spin\'&gt;refresh&lt;/span&gt;&lt;span&gt;Resetting...&lt;/span&gt;'; setTimeout(() =&gt; { btn.disabled = false; btn.innerHTML = '&lt;span class=\'material-symbols-outlined text-[20px]\'&gt;restart_alt&lt;/span&gt;&lt;span&gt;Queue Reset&lt;/span&gt;'; }, 1200);" type="button">
