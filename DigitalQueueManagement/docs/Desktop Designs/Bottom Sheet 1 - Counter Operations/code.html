<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"outline":"#757684","secondary":"#006a61","on-tertiary":"#ffffff","tertiary-fixed-dim":"#ffb77d","on-secondary-container":"#006f66","surface-tint":"#3755c3","surface-bright":"#f8f9ff","surface-container-lowest":"#ffffff","inverse-surface":"#213145","tertiary-fixed":"#ffdcc3","error":"#ba1a1a","on-primary-fixed-variant":"#173bab","background":"#f8f9ff","secondary-fixed":"#89f5e7","error-container":"#ffdad6","surface-variant":"#d3e4fe","tertiary":"#532a00","on-surface":"#0b1c30","on-error":"#ffffff","tertiary-container":"#743d00","on-secondary-fixed-variant":"#005049","surface-container-highest":"#d3e4fe","primary-fixed-dim":"#b8c4ff","primary":"#00288e","outline-variant":"#c4c5d5","on-primary":"#ffffff","on-primary-fixed":"#001453","surface-container":"#e5eeff","primary-fixed":"#dde1ff","on-surface-variant":"#444653","primary-container":"#1e40af","secondary-container":"#86f2e4","on-primary-container":"#a8b8ff","on-secondary":"#ffffff","inverse-primary":"#b8c4ff","inverse-on-surface":"#eaf1ff","on-background":"#0b1c30","surface-container-high":"#dce9ff","surface-container-low":"#eff4ff","surface":"#f8f9ff","surface-dim":"#cbdbf5","secondary-fixed-dim":"#6bd8cb","on-secondary-fixed":"#00201d","on-tertiary-fixed-variant":"#6e3900","on-error-container":"#93000a","on-tertiary-container":"#ffa85d","on-tertiary-fixed":"#2f1500"},borderRadius:{"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},spacing:{"space-sm":"0.5rem","gutter":"1rem","space-md":"0.75rem","margin":"1rem","margin-desktop":"2rem","gutter-desktop":"1.5rem","space-2xl":"2rem","space-lg":"1rem","space-xl":"1.5rem","space-xs":"0.25rem"},fontFamily:{"headline-lg-mobile":["Inter"],"headline-sm":["Inter"],"display-ticket":["Inter"],"code-tabular":["Inter"],"label-lg":["Inter"],"headline-lg":["Inter"],"body-lg":["Inter"],"display-ticket-mobile":["Inter"],"label-sm":["Inter"],"body-md":["Inter"],"headline-md":["Inter"],"body-sm":["Inter"],"label-md":["Inter"]},fontSize:{"headline-lg-mobile":["26px",{"lineHeight":"32px","letterSpacing":"0em","fontWeight":"600"}],"headline-sm":["20px",{"lineHeight":"28px","fontWeight":"600"}],"display-ticket":["48px",{"lineHeight":"56px","letterSpacing":"-0.02em","fontWeight":"700"}],"code-tabular":["14px",{"lineHeight":"20px","fontWeight":"500"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"600"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.01em","fontWeight":"600"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"display-ticket-mobile":["36px",{"lineHeight":"44px","letterSpacing":"-0.01em","fontWeight":"700"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.04em","fontWeight":"700"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"headline-md":["24px",{"lineHeight":"32px","letterSpacing":"-0.01em","fontWeight":"600"}],"body-sm":["12px",{"lineHeight":"16px","fontWeight":"400"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"600"}]}}}};</script></head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen"><main class="min-h-screen w-full relative flex items-center justify-center p-gutter md:p-gutter-desktop bg-inverse-surface/40 backdrop-blur-sm"><div class="w-full max-w-xl bg-surface-container-lowest rounded-xl shadow-[0_10px_15px_-3px_rgba(15,23,42,0.12),0_4px_6px_-4px_rgba(15,23,42,0.08)] relative z-10 overflow-hidden"><div class="flex flex-col w-full">
<div class="flex flex-col bg-surface-container-lowest rounded-xl shadow-xl w-full max-w-[560px] mx-auto overflow-hidden">
<!-- Modal Header -->
<header class="flex items-center justify-between px-space-xl py-space-lg bg-surface-container-low">
<div class="flex items-center gap-space-md">
<div class="flex items-center justify-center w-10 h-10 rounded-xl bg-primary text-on-primary">
<span class="material-symbols-outlined text-[20px]">desktop_windows</span>
</div>
<div class="flex flex-col">
<div class="flex items-center gap-space-sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Counter Operations</h2>
<div class="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-secondary-container text-on-secondary-container">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Online</span>
</div>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Counter 1 — Express Desk</span>
</div>
</div>
<button aria-label="Close dialog" class="flex items-center justify-center w-8 h-8 rounded-lg bg-surface-container hover:bg-surface-variant text-on-surface-variant hover:text-on-surface transition-colors cursor-pointer" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</header>
<!-- Modal Content -->
<div class="flex flex-col p-space-xl gap-space-xl bg-surface-container-lowest">
<!-- Currently Serving Panel -->
<section class="flex flex-col rounded-xl bg-surface-container-low p-space-xl shadow-sm relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1.5 bg-primary-container"></div>
<div class="flex items-center justify-between mb-space-sm pl-1">
<div class="flex items-center gap-2">
<span class="px-2.5 py-1 rounded-full bg-primary-fixed text-on-primary-fixed-variant font-label-sm text-label-sm uppercase tracking-wide">
              Priority VIP
            </span>
<span class="px-2.5 py-1 rounded-full bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm uppercase tracking-wide">
              Desk 1
            </span>
</div>
<span class="font-label-sm text-label-sm uppercase text-outline font-semibold tracking-wider">
            CURRENTLY SERVING
          </span>
</div>
<div class="flex flex-col sm:flex-row sm:items-baseline justify-between gap-space-sm my-space-sm pl-1">
<div class="flex items-baseline gap-space-md">
<span class="font-display-ticket text-display-ticket text-primary tracking-tight font-bold" id="ticket-id">
              A-104
            </span>
<div class="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-surface-container text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-primary">payments</span>
<span class="font-label-md text-label-md">Payments &amp; Billing</span>
</div>
</div>
</div>
<!-- Timer / Metrics Bar -->
<div class="grid grid-cols-2 gap-space-md pt-space-md mt-space-xs pl-1">
<div class="flex items-center gap-2.5 px-space-md py-space-sm rounded-lg bg-surface-container-lowest">
<span class="material-symbols-outlined text-outline text-[18px]">schedule</span>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-outline">Wait Time</span>
<span class="font-code-tabular text-code-tabular text-on-surface font-semibold">3m 12s</span>
</div>
</div>
<div class="flex items-center gap-2.5 px-space-md py-space-sm rounded-lg bg-surface-container-lowest">
<span class="material-symbols-outlined text-secondary text-[18px]">timer</span>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-outline">Serving Time</span>
<span class="font-code-tabular text-code-tabular text-secondary font-semibold" id="serving-timer">13:26</span>
</div>
</div>
</div>
</section>
<!-- Primary Service Actions -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-space-md">
<button class="flex items-center justify-center gap-2 py-3 px-space-lg rounded-lg bg-secondary hover:bg-on-secondary-container active:opacity-95 text-on-secondary font-label-lg text-label-lg shadow-sm transition-all cursor-pointer" id="btn-complete" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="">Complete Service</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 px-space-lg rounded-lg bg-primary-container hover:bg-primary active:opacity-95 text-on-primary font-label-lg text-label-lg shadow-sm transition-all cursor-pointer" id="btn-call-next" type="button">
<span class="">Call Next</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Queue Controls (Action Tiles) -->
<div class="flex flex-col gap-space-xs">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-outline px-1">Queue Actions</span>
<div class="grid grid-cols-3 gap-space-sm">
<button class="flex flex-col items-center justify-center gap-1.5 py-3 px-2 rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface hover:text-error transition-all group cursor-pointer shadow-sm" id="action-skip" type="button">
<span class="material-symbols-outlined text-[20px] text-outline group-hover:text-error transition-colors">skip_next</span>
<span class="font-label-md text-label-md font-medium">Skip</span>
</button>
<button class="flex flex-col items-center justify-center gap-1.5 py-3 px-2 rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface hover:text-primary transition-all group cursor-pointer shadow-sm" id="action-recall" type="button">
<span class="material-symbols-outlined text-[20px] text-outline group-hover:text-primary transition-colors">campaign</span>
<span class="font-label-md text-label-md font-medium">Recall</span>
</button>
<button class="flex flex-col items-center justify-center gap-1.5 py-3 px-2 rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface hover:text-secondary transition-all group cursor-pointer shadow-sm" id="action-transfer" type="button">
<span class="material-symbols-outlined text-[20px] text-outline group-hover:text-secondary transition-colors">swap_horiz</span>
<span class="font-label-md text-label-md font-medium">Transfer</span>
</button>
</div>
</div>
</div>
<!-- Active Indicator Footer Strip -->

</div>
<script>
    (function () {
      let seconds = 225;
      const timerEl = document.getElementById('serving-timer');
      
      setInterval(function () {
        seconds++;
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        if (timerEl) {
          timerEl.textContent = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
        }
      }, 1000);

      const ticketEl = document.getElementById('ticket-id');
      const callNextBtn = document.getElementById('btn-call-next');
      const completeBtn = document.getElementById('btn-complete');

      if (callNextBtn && ticketEl) {
        callNextBtn.addEventListener('click', function () {
          const currentNum = parseInt(ticketEl.textContent.replace('A-', ''), 10) || 104;
          ticketEl.textContent = 'A-' + (currentNum + 1);
          seconds = 0;
          if (timerEl) timerEl.textContent = '00:00';
        });
      }

      if (completeBtn && ticketEl) {
        completeBtn.addEventListener('click', function () {
          const original = ticketEl.textContent;
          ticketEl.textContent = 'DONE';
          setTimeout(function () {
            if (ticketEl.textContent === 'DONE') {
              const currentNum = parseInt(original.replace('A-', ''), 10) || 104;
              ticketEl.textContent = 'A-' + (currentNum + 1);
              seconds = 0;
            }
          }, 1200);
        });
      }
    })();
  </script>
</div></div></main>

</body></html>
