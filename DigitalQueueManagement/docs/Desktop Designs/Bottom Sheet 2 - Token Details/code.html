<!-- Modal Backdrop Overlay Layer (Visual Grounding) -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-[2px] transition-opacity -z-10"></div>
<!-- Dialog Window: Syncfusion / Enterprise Service Desk Styled Modal (~540px) -->
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-xl flex flex-col overflow-hidden relative transition-all">
<!-- Modal Header -->
<div class="flex items-center justify-between px-space-lg py-space-md border-b border-surface-container-high bg-surface-container-lowest">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
<h2 class="font-headline-sm text-[18px] text-on-surface font-semibold">Token Details</h2>
</div>
<button aria-label="Close dialog" class="w-8 h-8 rounded flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors focus:outline-none" id="dismissModalBtn" onclick="this.closest('.max-w-\[440px\]').classList.add('opacity-0', 'scale-95');" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>

<!-- Modal Body Content -->
<div class="p-space-lg flex flex-col gap-space-md">
<!-- Token Hero Display Banner (Mirrors Mobile Token Sheet) -->
<div class="bg-surface-container-low rounded-lg p-space-md flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Token Number</span>
<div class="flex items-center gap-1.5 px-space-sm py-0.5 rounded-full bg-surface-container-highest">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-primary font-code-tabular uppercase tracking-wide">Waiting</span>
</div>
</div>
<div class="flex items-baseline justify-between mt-0.5">
<span class="font-display-ticket text-display-ticket text-primary font-code-tabular tracking-tight">A-105</span>
<span class="px-2 py-0.5 rounded text-tertiary-container bg-tertiary-fixed font-label-sm text-label-sm font-semibold flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">stars</span>
Senior Priority
</span>
</div>
<div class="flex items-center gap-1.5 pt-1 border-t border-surface-container-high text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">receipt_long</span>
<span class="font-body-sm text-body-sm text-on-surface font-medium">Payments &amp; Billing</span>
</div>
</div>

<!-- Key Information Grid: Wait Time & Desk -->
<div class="grid grid-cols-2 gap-space-sm">
<!-- Est. Wait Card -->
<div class="bg-surface-container rounded-lg p-space-md flex flex-col justify-between">
<div class="flex items-center gap-1 text-on-surface-variant mb-1">
<span class="material-symbols-outlined text-[16px] text-primary">schedule</span>
<span class="font-label-sm text-label-sm uppercase tracking-wide">Est. Wait</span>
</div>
<span class="font-headline-sm text-[18px] text-on-surface font-code-tabular font-semibold">~4 min</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">2 ahead in queue</span>
</div>

<!-- Assigned Counter Card -->
<div class="bg-surface-container rounded-lg p-space-md flex flex-col justify-between">
<div class="flex items-center gap-1 text-on-surface-variant mb-1">
<span class="material-symbols-outlined text-[16px] text-primary">desktop_windows</span>
<span class="font-label-sm text-label-sm uppercase tracking-wide">Assigned Desk</span>
</div>
<span class="font-headline-sm text-[18px] text-on-surface font-semibold">Counter 1</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Express Desk</span>
</div>
</div>

<!-- Operational Action Buttons Row -->
<div class="grid grid-cols-2 gap-space-sm pt-1">
<button class="w-full px-space-md py-2 rounded bg-surface-container-high text-primary hover:bg-surface-container-highest transition-colors active:scale-[0.99] flex items-center justify-center gap-1.5 font-label-md text-label-md" id="btnTransfer" onclick="handleTokenAction(this, 'Transfer')" type="button">
<span class="material-symbols-outlined text-[18px]">swap_horiz</span>
<span class="">Transfer Token</span>
</button>
<button class="w-full px-space-md py-2 rounded bg-surface-container-high text-primary hover:bg-surface-container-highest transition-colors active:scale-[0.99] flex items-center justify-center gap-1.5 font-label-md text-label-md" id="btnRecall" onclick="handleTokenAction(this, 'Recall')" type="button">
<span class="material-symbols-outlined text-[18px]">campaign</span>
<span class="">Recall Token</span>
</button>
</div>
</div>

<!-- Modal Footer with Primary Dismiss Action -->
<div class="p-space-lg pt-0 bg-surface-container-lowest">
<button class="w-full py-2.5 px-space-md rounded bg-primary text-on-primary font-label-lg text-label-lg hover:bg-primary-container shadow-sm transition-all active:scale-[0.99] flex items-center justify-center gap-1.5" onclick="this.closest('.max-w-\[440px\]').classList.add('opacity-0', 'scale-95');" type="button">
<span class="material-symbols-outlined text-[18px]">check</span>
<span class="">Close Details</span>
</button>
</div>
</div>
<!-- Operational Micro-interaction Handler -->
<script>
    function handleTokenAction(buttonEl, actionName) {
      const origText = buttonEl.innerHTML;
      buttonEl.innerHTML = `<span class="material-symbols-outlined text-[18px] animate-spin">refresh</span><span>Processing...</span>`;
      buttonEl.disabled = true;

      setTimeout(() => {
        buttonEl.innerHTML = `<span class="material-symbols-outlined text-[18px]">done</span><span>${actionName}ed</span>`;
        setTimeout(() => {
          buttonEl.innerHTML = origText;
          buttonEl.disabled = false;
        }, 1800);
      }, 700);
    }
  </script>
</div></main>
