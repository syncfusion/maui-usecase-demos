<script>
  (function() {
    const resetBtn = document.getElementById('confirm-reset-btn');
    if (resetBtn) {
      resetBtn.addEventListener('click', function() {
        this.innerHTML = `
          <span class="inline-block animate-spin material-symbols-outlined text-[20px]">progress_activity</span>
          <span>Restoring Seed Data...</span>
        `;
        this.classList.add('opacity-90', 'cursor-not-allowed');
        setTimeout(() => {
          this.innerHTML = `
            <span class="material-symbols-outlined text-[20px]">done</span>
            <span>Queue Reset Successfully</span>
          `;
          this.classList.remove('bg-error');
          this.classList.add('bg-secondary', 'text-on-secondary');
          setTimeout(() => {
            history.back();
          }, 600);
        }, 1200);
      });
    }
  })();
